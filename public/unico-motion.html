<!doctype html>
<meta charset="utf-8">
<title>unico motion</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  canvas{position:absolute;image-rendering:auto}
  #hud{position:absolute;left:12px;bottom:10px;font-size:12px;color:#fff;opacity:.45;pointer-events:none}
  #bar{position:absolute;right:12px;bottom:8px;display:flex;gap:8px;align-items:center}
  button{border:0;border-radius:999px;padding:7px 14px;font:500 12px/1 ui-sans-serif,system-ui;background:#f6f6f5;color:#111;cursor:pointer}
  #msg{font-size:12px;color:#fff;opacity:.6}
</style>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="hud"></div>
<div id="bar"><span id="msg"></span><button id="rec">gravar</button></div>
<script>
// Motion da grade de cores da unico, 1920 x 1080.
//
// Linha do tempo (s):
//   0,00 – 0,98  o logo monta em full-bleed, dentro da célula central (rosa). O ombro do "n" cai por último.
//   1,15 – 1,85  a câmera recua e trava na grade — mas ela está TODA rosa, com um logo só no meio.
//   1,55 – 2,50  a cor entra montada no fim do recuo: UMA frente, um quadrado que cresce do centro
//                e pinta os nove. Sobrepõe o último terço do recuo — a frente nasce pequena no meio,
//                então a borda do quadro já passou dela e ela aparece o percurso todo.
//                Os outros oito logos não montam — já estão prontos, com a ponta colorida; a frente
//                só revela. Quem monta é só o logo principal, no começo.
//   3,00         fim. Não volta: o preview rebobina com corte seco, o vídeo termina na grade.
//
// Os dois movimentos são SEPARADOS de propósito. Quando rodavam juntos, a frente de cor andava
// sempre na frente da borda do quadro (largura visível = 1/(2s), frente = R; só se igualam nas
// pontas) — ou seja, a cor chegava antes de dar pra ver, e o trecho virava só um zoom out.

const W = 1920, H = 1080, FPS = 60, LOOP_S = 3.0;
const TOTAL_FRAMES = Math.round(LOOP_S * FPS);

const GRID = 3;
const COMP_W = W * GRID, COMP_H = H * GRID;
const WIDE = 1 / GRID;                 // escala em que a grade preenche o quadro
const MID = 1;                         // linha/coluna do centro

// Paleta medida na arte de referência: fundo da célula + cor do ombro do "n".
const CELLS = [
  { bg: "#033AED", accent: "#FF0767" },
  { bg: "#00A5FF", accent: "#FF0767" },
  { bg: "#0FC5FF", accent: "#FF0767" },
  { bg: "#25C632", accent: "#FF0767" },
  { bg: "#FF0767", accent: "#0FC5FF" },
  { bg: "#EA670B", accent: "#0FC5FF" },
  { bg: "#FFCE02", accent: "#FF0767" },
  { bg: "#CBD800", accent: "#033AED" },
  { bg: "#E62E01", accent: "#00A5FF" },
];
const CENTER = 4;
const WHITE = "#FFFFFF";

// Logo: 33,8% da largura da célula, como na arte. Paths de /logos/unico.svg (viewBox 94 x 20).
const LOGO_W = W * 0.338;
const LOGO_H = LOGO_W * 20 / 94;
const K = LOGO_W / 94;

// `order` = ordem de entrada na montagem, da esquerda pra direita: u, n, i, c, o.
const GLYPHS = [
  { order: 0, d: "M10.103 19.7598C4.50714 19.7434 0 15.2494 0 9.78403V0.62317C0 0.285707 0.286971 0.00585938 0.633024 0.00585938H3.16513C3.51962 0.00585938 3.79815 0.285707 3.79815 0.62317V9.80053C3.79815 13.1999 6.58345 16.0148 10.0693 16.0559C13.5889 16.0889 16.4586 13.3069 16.4586 9.88286V0.62317C16.4586 0.285707 16.7456 0.00585938 17.0917 0.00585938H19.6238C19.9698 0.00585938 20.2567 0.285707 20.2567 0.62317V9.88286C20.2567 15.3399 15.699 19.7763 10.103 19.7598Z" },
  { order: 1, d: "M42.4126 19.7598H39.8805C39.5345 19.7598 39.2474 19.48 39.2474 19.1426V9.96516C39.2474 6.56586 36.4621 3.7427 32.9764 3.70977C29.4568 3.67685 26.587 6.45886 26.587 9.88291V19.1426C26.587 19.48 26.3084 19.7598 25.954 19.7598H23.4219C23.0759 19.7598 22.7888 19.48 22.7888 19.1426V9.98166C22.7888 4.51639 27.2876 0.0223667 32.8919 0.00590504C38.4878 -0.0105566 43.0456 4.42585 43.0456 9.88291V19.1426C43.0456 19.48 42.7587 19.7598 42.4126 19.7598Z" },
  { order: 4, d: "M83.8716 3.70973C80.3773 3.70973 77.5414 6.47528 77.5414 9.88286C77.5414 13.2904 80.3773 16.0559 83.8716 16.0559C87.3662 16.0559 90.2015 13.2904 90.2015 9.88286C90.2015 6.47528 87.3662 3.70973 83.8716 3.70973ZM83.8716 19.7598C78.284 19.7598 73.7432 15.3316 73.7432 9.88286C73.7432 4.43404 78.2925 0.00585938 83.8716 0.00585938C89.4504 0.00585938 94 4.43404 94 9.88286C94 15.3316 89.4589 19.7598 83.8716 19.7598Z" },
  { order: 2, d: "M48.743 19.7598H46.2109C45.8648 19.7598 45.5779 19.4799 45.5779 19.1425V0.62317C45.5779 0.285707 45.8648 0.00585938 46.2109 0.00585938H48.743C49.089 0.00585938 49.376 0.285707 49.376 0.62317V19.1425C49.376 19.4799 49.089 19.7598 48.743 19.7598Z" },
  { order: 3, d: "M67.3792 12.9858C66.2819 14.8212 64.2309 16.0558 61.9015 16.0558C58.5253 16.0558 55.7231 13.422 55.5881 10.1297C55.4446 6.61509 58.3396 3.70961 61.9099 3.70961C64.2309 3.70961 66.2566 4.92777 67.3623 6.74678C67.4974 6.96078 67.7337 7.09247 67.9954 7.09247H70.9664C71.3039 7.09247 71.5318 6.76324 71.4137 6.4587C69.9367 2.59022 66.0541 -0.14241 61.5469 0.00574456C56.238 0.186822 51.9419 4.40923 51.79 9.58642C51.6296 15.1587 56.2296 19.7515 61.9099 19.7515C66.2651 19.7515 69.9872 17.0518 71.4137 13.2821C71.5318 12.9775 71.3039 12.6565 70.9664 12.6565H67.9532C67.7168 12.6565 67.4974 12.78 67.3708 12.9775" },
];
// Ombro do "n": a única peça que muda de cor entre os nove quadros da arte.
const ACCENT_D = "M26.5871 0.631401C26.5871 0.285707 26.3001 0.00585938 25.9541 0.00585938H23.4304C23.0759 0.00585938 22.7974 0.285707 22.7974 0.631401V5.47112C22.7974 5.47112 22.8227 5.49581 22.8311 5.47112C23.6161 3.61919 24.9328 2.03064 26.5871 0.878329C26.5871 0.878329 26.5956 0.870095 26.5956 0.861862V0.631401H26.5871Z";

const GLYPH_STEP = 0.065, GLYPH_DUR = 0.46, GLYPH_RISE = 55;
const ACCENT_AT = 0.46, ACCENT_DUR = 0.52, ACCENT_DROP = 90;
const ZOOM_OUT_AT = 1.15, ZOOM_OUT_DUR = 0.7;
// A frente de cor: meio quadrado (só a célula central) crescendo até cobrir a grade.
// Começa depois que a câmera travou, senão ela não é vista — ver nota no topo.
const FRONT_AT = 1.55, FRONT_DUR = 0.95, FRONT_FROM = 0.5, FRONT_TO = 1.5;


const clamp01 = n => n < 0 ? 0 : n > 1 ? 1 : n;

// Solver de cubic-bezier, pra usar em JS as mesmas curvas do resto do portfólio.
function bezier(x1, y1, x2, y2) {
  const ax = 3*x1 - 3*x2 + 1, bx = 3*x2 - 6*x1, cx = 3*x1;
  const ay = 3*y1 - 3*y2 + 1, by = 3*y2 - 6*y1, cy = 3*y1;
  const fx = t => ((ax*t + bx)*t + cx)*t;
  const dfx = t => (3*ax*t + 2*bx)*t + cx;
  return x => {
    let t = clamp01(x);
    for (let i = 0; i < 6; i++) {
      const d = dfx(t);
      if (Math.abs(d) < 1e-6) break;
      t -= (fx(t) - x) / d;
    }
    t = clamp01(t);
    return ((ay*t + by)*t + cy)*t;
  };
}
const FUEL        = bezier(0.44, 0, 0.34, 0.98);  // opacidade das peças do logo: sem elástico
const ELASTIC     = bezier(0.34, 1.57, 0.64, 1);  // deslocamento das peças: passa 10% e volta
const SETTLE      = bezier(0.18, 1.53, 0.32, 1);  // mola do ombro: passa 9% e volta
// Recuo com um leve passar do ponto: a grade fica um tiquinho menor e volta. Seguro — nesse
// trecho tudo ainda é rosa (o fundo do canvas inclusive), então o excesso de enquadramento não
// mostra brecha nenhuma; o que se vê é só o logo central dando a respirada.
const EASE_OUT    = bezier(0.3, 1.32, 0.5, 1);    // passa 3,5% e volta
const PAINT       = bezier(0.4, 0, 0.2, 1);       // frente de cor: pega velocidade e assenta
                                                  // (elástico aqui não apareceria: o R é cortado
                                                  // pelos limites da célula)

// As nove células.
const TILES = [];
for (let r = 0; r < GRID; r++) {
  for (let c = 0; c < GRID; c++) {
    TILES.push({
      x: c * W, y: r * H,
      color: CELLS[r * 3 + c],
      idx: r * 3 + c,
    });
  }
}

// Uma variável só comanda a entrada: onde está a frente de cor, em unidades de célula.
function frontAt(t) {
  return FRONT_FROM + (FRONT_TO - FRONT_FROM) * PAINT(clamp01((t - FRONT_AT) / FRONT_DUR));
}

function cameraScale(t) {
  if (t < ZOOM_OUT_AT) return 1;
  if (t < ZOOM_OUT_AT + ZOOM_OUT_DUR) return 1 + (WIDE - 1) * EASE_OUT((t - ZOOM_OUT_AT) / ZOOM_OUT_DUR);
  return WIDE;
}

const glyphIn = (order, t) => clamp01((t - order * GLYPH_STEP) / GLYPH_DUR);

const GLYPH_PATHS = GLYPHS.map(g => new Path2D(g.d));
const ACCENT_PATH = new Path2D(ACCENT_D);

// Parte da célula já pintada: interseção dela com o quadrado da frente.
// Como a frente é uma só, os nove blocos leem como uma superfície sendo pintada,
// e não como oito retângulos chegando cada um na sua hora.
function cellRect(tl, R) {
  const cx = COMP_W / 2, cy = COMP_H / 2;
  const x0 = Math.max(tl.x, cx - R * W), x1 = Math.min(tl.x + W, cx + R * W);
  const y0 = Math.max(tl.y, cy - R * H), y1 = Math.min(tl.y + H, cy + R * H);
  return [x0, y0, Math.max(0, x1 - x0), Math.max(0, y1 - y0)];
}

function drawLogo(ctx, x, y, o) {
  if (o.alpha <= 0) return;
  ctx.save();
  ctx.translate(x + LOGO_W / 2 + (o.dx || 0), y + LOGO_H / 2 + (o.dy || 0));
  ctx.scale(o.scale, o.scale);
  ctx.translate(-LOGO_W / 2, -LOGO_H / 2);
  ctx.scale(K, K);
  for (let i = 0; i < GLYPHS.length; i++) {
    const per = o.glyph ? o.glyph(GLYPHS[i].order) : null;
    const a = o.alpha * (per ? per.alpha : 1);
    if (a <= 0) continue;
    ctx.save();
    if (per) ctx.translate(0, per.rise / K);
    ctx.globalAlpha = a;
    ctx.fillStyle = WHITE;
    ctx.fill(GLYPH_PATHS[i]);
    ctx.restore();
  }
  const aa = o.alpha * o.accentAlpha;
  if (aa > 0) {
    ctx.save();
    ctx.translate(0, o.accentRise / K);
    ctx.globalAlpha = aa;
    ctx.fillStyle = o.accentColor;
    ctx.fill(ACCENT_PATH);
    ctx.restore();
  }
  ctx.restore();
}

function drawFrame(ctx, time) {
  const t = ((time % LOOP_S) + LOOP_S) % LOOP_S;
  const s = cameraScale(t);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = CELLS[CENTER].bg;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.scale(s, s);
  ctx.translate(-COMP_W / 2, -COMP_H / 2);

  // Fundos: a frente de cor cresce do centro e vai pintando a grade por cima do rosa.
  const R = frontAt(t);
  ctx.fillStyle = CELLS[CENTER].bg;
  ctx.fillRect(0, 0, COMP_W, COMP_H);
  for (const tl of TILES) {
    ctx.fillStyle = tl.color.bg;
    ctx.fillRect(...cellRect(tl, R));
  }

  // Os outros oito não montam: já estão prontos, com a ponta colorida. A frente só revela.
  for (const tl of TILES) {
    if (tl.idx === CENTER) continue;
    ctx.save();
    ctx.beginPath();
    ctx.rect(...cellRect(tl, R));
    ctx.clip();
    drawLogo(ctx, tl.x + (W - LOGO_W) / 2, tl.y + (H - LOGO_H) / 2, {
      alpha: 1,
      scale: 1,
      accentColor: tl.color.accent,
      accentAlpha: 1,
      accentRise: 0,
    });
    ctx.restore();
  }

  // Célula central: é nela que o logo monta, peça por peça.
  const mid = TILES[MID * GRID + MID];
  const settle = SETTLE(clamp01((t - ACCENT_AT) / ACCENT_DUR));
  drawLogo(ctx, mid.x + (W - LOGO_W) / 2, mid.y + (H - LOGO_H) / 2, {
    alpha: 1,
    scale: 1,
    accentColor: CELLS[CENTER].accent,
    accentAlpha: settle,
    accentRise: -(1 - settle) * ACCENT_DROP,
    glyph: order => {
      const u = glyphIn(order, t);
      return { alpha: FUEL(u), rise: (1 - ELASTIC(u)) * GLYPH_RISE };
    },
  });

  ctx.restore();
}

/* ---------- preview ---------- */

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const hud = document.getElementById("hud");

function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  canvas.style.width = W * s + "px";
  canvas.style.height = H * s + "px";
  canvas.style.left = (innerWidth - W * s) / 2 + "px";
  canvas.style.top = (innerHeight - H * s) / 2 + "px";
}
fit();
addEventListener("resize", fit);

const q = new URLSearchParams(location.search);
let frame = q.has("f") ? +q.get("f") : q.has("t") ? Math.round(+q.get("t") * FPS) : 0;
let playing = !(q.has("f") || q.has("t"));
let anchorFrame = frame, anchorTime = performance.now();
let recording = false;

function paint() {
  const f = ((frame % TOTAL_FRAMES) + TOTAL_FRAMES) % TOTAL_FRAMES;
  // Conteúdo vem do índice do quadro, nunca do relógio: o que se vê aqui é o que a gravação gera.
  drawFrame(ctx, f / FPS);
  hud.textContent = `${f}/${TOTAL_FRAMES}  ${(f / FPS).toFixed(2)}s  ${playing ? "" : "⏸"}  ·  ${LOOP_S}s @ ${FPS}fps · ␣ pausa · ←/→ quadro`;
}

(function tick() {
  if (!recording) {
    if (playing) frame = anchorFrame + Math.round((performance.now() - anchorTime) / 1000 * FPS);
    paint();
  }
  requestAnimationFrame(tick);
})();

addEventListener("keydown", e => {
  if (e.key === " ") {
    e.preventDefault();
    playing = !playing;
    anchorFrame = frame;
    anchorTime = performance.now();
  }
  if (e.key === "ArrowRight") { playing = false; frame += e.shiftKey ? 10 : 1; }
  if (e.key === "ArrowLeft")  { playing = false; frame -= e.shiftKey ? 10 : 1; }
});

/* ---------- gravação ---------- */
// Desenha os 330 quadros em ritmo real (pro container ter a duração certa) e salva.
// Servido pelo next dev, vai pra renders/ via /api/save-render; aberto como arquivo, baixa.

const recBtn = document.getElementById("rec");
const msg = document.getElementById("msg");

recBtn.onclick = async () => {
  if (recording) return;
  recording = true;
  playing = false;
  recBtn.disabled = true;
  try {
    const stream = canvas.captureStream(0);
    const track = stream.getVideoTracks()[0];
    const mime = MediaRecorder.isTypeSupported("video/mp4;codecs=avc1.640034")
      ? "video/mp4;codecs=avc1.640034"
      : "video/webm;codecs=vp9";
    const ext = mime.startsWith("video/mp4") ? "mp4" : "webm";
    const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 24e6 });
    const chunks = [];
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    const done = new Promise(r => rec.onstop = r);

    rec.start();
    const t0 = performance.now();
    for (let f = 0; f < TOTAL_FRAMES; f++) {
      drawFrame(ctx, f / FPS);
      track.requestFrame();
      msg.textContent = `gravando ${Math.round((f + 1) / TOTAL_FRAMES * 100)}%`;
      const wait = t0 + (f + 1) / FPS * 1000 - performance.now();
      if (wait > 0) await new Promise(r => setTimeout(r, wait));
    }
    rec.stop();
    await done;

    const blob = new Blob(chunks, { type: mime });
    msg.textContent = `enviando ${(blob.size / 1e6).toFixed(1)} MB…`;
    let saved = false;
    try {
      const res = await fetch(`/api/save-render?name=unico-motion.${ext}`, { method: "POST", body: blob });
      if (res.ok) {
        const json = await res.json();
        msg.textContent = `salvo em ${json.path} (${(json.bytes / 1e6).toFixed(1)} MB)`;
        saved = true;
      }
    } catch {}
    if (!saved) {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `unico-motion.${ext}`;
      a.click();
      msg.textContent = `baixado (${(blob.size / 1e6).toFixed(1)} MB)`;
    }
  } catch (err) {
    msg.textContent = "erro: " + err.message;
  } finally {
    recording = false;
    recBtn.disabled = false;
    anchorFrame = frame = 0;
    anchorTime = performance.now();
    playing = true;
  }
};
</script>
