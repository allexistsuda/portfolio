<!doctype html>
<meta charset="utf-8">
<title>bibliotecas 02 — ácaro</title>
<style>
  body { margin:0; background:#111; font:13px ui-sans-serif,system-ui; color:#eee }
  body.render { background:#fff }
  body.render #barra { display:none }
  #palco { position:relative; margin:0 auto; transform-origin:top left; overflow:hidden; background:#F5F5F5 }
  #palco img.aparelho { position:absolute; display:block; max-width:none }
  /* a janela é o retângulo exato da foto dentro do celular da esquerda */
  #janela { position:absolute; overflow:hidden }
  #janela video { display:block; width:100%; height:100%; object-fit:cover }
  #barra { position:fixed; left:0; right:0; bottom:0; background:#1a1a1a; padding:10px 16px;
           display:flex; gap:18px; align-items:center; flex-wrap:wrap; z-index:9 }
  label { display:flex; gap:7px; align-items:center; opacity:.85; white-space:nowrap }
  input[type=range] { width:120px }
  code { opacity:.55 }
</style>

<main><div id="palco">
  <img class="aparelho" id="a4" src="/_bib2/tela4.png" alt="">
  <img class="aparelho" id="a5" src="/_bib2/tela5.png" alt="">
  <div id="janela"><video id="v" src="/_bib2/acaro.mp4" muted playsinline></video></div>
</div></main>

<div id="barra">
  <label>raio <input id="raio" type="range" min="0" max="40" value="12"><code id="craio"></code></label>
  <code id="info"></code>
</div>

<script type="module">
const params = new URLSearchParams(location.search);
const RENDER = params.has("render");
// ?mobile=1: só o celular do artigo, no enquadramento dos mockups parados
const MOBILE = params.has("mobile");
const W = MOBILE ? 1092 : 2720, H = MOBILE ? 1702 : 1792;
const DUR = 6.2;

// Mesma régua da composição de três: o PNG sai do Figma a 1,07362x (925x1631) e é
// posicionado pela moldura preta, que começa em (13, 8) dentro do arquivo.
const PNG = { w: 925, h: 1631, pretoX: 13, pretoY: 8 };
const PRETO = MOBILE ? { x: [194], y: 120 } : { x: [587, 1426], y: 161 };
// o retângulo âmbar da foto, medido em tela4.png
const FOTO = { x: 68, y: 643, w: 595, h: 516 };

const palco = document.getElementById("palco");
palco.style.width = W + "px"; palco.style.height = H + "px";

const esq = (i) => PRETO.x[i] - PNG.pretoX;
const topo = PRETO.y - PNG.pretoY;
const ORDEM = MOBILE ? ["a4"] : ["a4", "a5"];
if (MOBILE) document.getElementById("a5").remove();
ORDEM.forEach((id, i) => {
  const el = document.getElementById(id);
  el.style.left = esq(i) + "px";
  el.style.top = topo + "px";
  el.style.width = PNG.w + "px";
  el.style.height = PNG.h + "px";
});

const janela = document.getElementById("janela");
janela.style.left = (esq(0) + FOTO.x) + "px";
janela.style.top = (topo + FOTO.y) + "px";
janela.style.width = FOTO.w + "px";
janela.style.height = FOTO.h + "px";

function encaixa() {
  const s = Math.min((innerWidth - 40) / W, (innerHeight - 110) / H);
  palco.style.transform = `scale(${s})`;
  palco.style.marginLeft = ((innerWidth - W * s) / 2) + "px";
}
if (RENDER) { document.body.classList.add("render"); palco.style.transform = "none"; palco.style.marginLeft = "0"; }
else { addEventListener("resize", encaixa); encaixa(); }

const raio = document.getElementById("raio");
if (params.has("raio")) raio.value = params.get("raio");
const aplicaRaio = () => {
  janela.style.borderRadius = raio.value + "px";
  document.getElementById("craio").textContent = raio.value + "px";
};
raio.oninput = aplicaRaio; aplicaRaio();

document.getElementById("info").textContent = `foto ${FOTO.w}x${FOTO.h} no palco em ${esq(0) + FOTO.x},${topo + FOTO.y}`;

const v = document.getElementById("v");
if (RENDER) {
  // o relógio manda no quadro do vídeo, igual às outras peças
  v.pause();
  window.__pronto = false;
  let ultimo = null;
  v.addEventListener("seeked", () => { window.__pronto = true; });
  const tique = () => {
    const t = (window.__t ?? 0);
    if (t !== ultimo) { ultimo = t; v.currentTime = Math.min(DUR - 0.001, t % DUR); }
    requestAnimationFrame(tique);
  };
  tique();
} else {
  v.loop = true;
  v.play().catch(() => {});
  window.__pronto = true;
}
</script>
