<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chegaram as bibliotecas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#3aae5b;
    --green-dark:#2f9a4e;
    --title:#1c1c1e;
    --body:#3a3a3c;
    --bg:#ffffff;
  }
  *{box-sizing:border-box;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  html,body{height:100%;margin:0;}
  body{
    margin:0;
    background:#fff;
    overflow-x:hidden;
    font-family:"Work Sans", system-ui, -apple-system, sans-serif;
  }
  /* desktop: center and fit to viewport height */
  .stage{
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;min-height:100dvh;
  }

  /* ---- Device frame: exact 375 x 812 ---- */
  .frame{
    position:relative;
    width:375px;height:812px;
    background:var(--bg);
    overflow:hidden;
    border-radius:0;
    user-select:none;
    transform-origin:center center;
  }
  /* mobile: switch stage to block so JS can size it for native scroll */
  @media (max-width:600px){
    .stage{ display:block; min-height:0; }
  }

  /* ---- Hero photo (image 60): x-74 y-43 w486 h1054, FILL ---- */
  .hero{
    position:absolute;left:0;top:-72px;
    width:375px;height:452px;
    object-fit:cover;object-position:50% 32%;
    display:block;
    transform-origin:50% 30%;
    will-change:transform;
  }
  /* fade the bottom of the video band into the frame bg */
  .hero-fade{
    position:absolute;left:0;right:0;top:250px;height:150px;
    background:linear-gradient(to bottom, rgba(255,255,255,0) 0%, var(--bg) 80%);
    pointer-events:none;
  }

  /* ---- Text block ---- */
  .title{
    position:absolute;left:24px;top:380px;width:327px;
    margin:0;
    font-weight:500;font-size:36px;line-height:44px;
    letter-spacing:-0.72px;
    color:var(--title);
  }
  .subtitle{
    position:absolute;left:24px;top:474px;width:327px;
    margin:0;
    font-weight:500;font-size:20px;line-height:28px;
    letter-spacing:-0.2px;
    color:var(--green);
  }
  .body{
    position:absolute;left:24px;top:570px;width:327px;
    margin:0;
    font-weight:400;font-size:16px;line-height:24px;
    color:var(--body);
  }

  /* ---- Primary button (Frame 20): x24 y680 w327 h48 r10 ---- */
  .btn{
    position:absolute;left:24px;top:648px;width:327px;height:48px;
    border:0;padding:0;
    display:flex;align-items:center;justify-content:center;gap:8px;
    background:var(--green);
    border-radius:10px;
    color:#fff;font-family:inherit;
    font-weight:600;font-size:16px;line-height:24px;
    cursor:pointer;overflow:hidden;
    transition:transform .18s cubic-bezier(.2,.8,.25,1), background .18s ease;
  }
  .btn:hover{background:#40b862;}
  .btn:active{transform:scale(.985);background:#37a656;}
  .btn span{position:relative;z-index:2;}
  /* animated arrow */
  .btn-arrow{position:relative;z-index:2;width:22px;height:22px;flex:none;display:block;
    animation:nudge 1.3s ease-in-out infinite;will-change:transform;}
  @keyframes nudge{0%,100%{transform:translateX(0);}50%{transform:translateX(4px);}}
  .btn:hover .btn-arrow{animation-play-state:paused;transform:translateX(5px);}
  .btn:active .btn-arrow{transform:translateX(2px);}
  /* ripple */
  .ripple{
    position:absolute;border-radius:50%;transform:translate(-50%,-50%) scale(0);
    background:rgba(255,255,255,.45);pointer-events:none;z-index:2;
    animation:ripple .6s ease-out forwards;
  }
  @keyframes ripple{to{transform:translate(-50%,-50%) scale(1);opacity:0;}}

  /* ---- Secondary text button ---- */
  .ghost{
    position:absolute;left:24px;top:708px;width:327px;height:32px;
    display:flex;align-items:center;justify-content:center;
    background:none;border:0;padding:0;cursor:pointer;
    font-family:inherit;font-weight:500;font-size:16px;line-height:24px;
    color:rgba(0,0,0,.8);
    transition:opacity .18s ease, transform .18s ease;
  }
  .ghost:hover{opacity:.6;}
  .ghost:active{transform:scale(.97);}

  /* ---- Entrance choreography (premium, GPU-only: transform + opacity) ---- */
  /* smooth expo-out settle — no blur (blur animation is what stutters) */
  .reveal{opacity:0;transform:translateY(16px);will-change:transform,opacity;}
  @keyframes rise{to{opacity:1;transform:translateY(0);}}
  .play .reveal{animation:rise 1s cubic-bezier(.16,1,.3,1) forwards;}

  /* hero: fade in only — no zoom/scale on the video */
  .play .hero{opacity:0;animation:heroIn 1s cubic-bezier(.16,1,.3,1) forwards;}
  @keyframes heroIn{from{opacity:0;}to{opacity:1;}}

  /* title: line-by-line mask reveal (transform only) */
  .title .line{display:block;overflow:hidden;padding-bottom:.14em;margin-bottom:-.14em;}
  .title .line > span{display:block;transform:translateY(118%);will-change:transform;}
  .play .title .line > span{animation:lineUp 1.05s cubic-bezier(.16,1,.3,1) forwards;}
  @keyframes lineUp{to{transform:translateY(0);}}

  /* stagger rhythm */
  .play .title .line:nth-child(1) > span{animation-delay:.28s;}
  .play .title .line:nth-child(2) > span{animation-delay:.40s;}
  .play .subtitle{animation-delay:.56s;}
  .play .body{animation-delay:.70s;}
  .play .btn{animation-delay:.86s;}
  .play .ghost{animation-delay:.98s;}

  .hint{
    position:fixed;bottom:14px;left:0;right:0;text-align:center;
    font:400 12px/1 "Work Sans",sans-serif;color:#8b8580;letter-spacing:.02em;
  }

  /* ===================== Screens & transition ===================== */
  .screen{position:absolute;inset:0;}

  /* The CTA opens into the next screen: a white rounded surface (the opener)
     grows from the button's exact rect (24,648,327x48,r10) to fill the frame. */
  .screen-bib{opacity:0;pointer-events:none;background:transparent;}
  .frame.show-bib .screen-bib{opacity:1;pointer-events:auto;}
  /* opener = white window that grows from the button rect; its content lives in
     .opener-inner, counter-translated so it stays locked to the frame while the
     window opens (overflow:hidden reveals it as the surface expands). */
  /* second circle: a lighter-green echo, concentric, slightly larger & leading */
  .opener-echo{
    position:absolute;left:24px;top:648px;width:327px;height:48px;border-radius:10px;
    background:#5cc07c;
    will-change:left,top,width,height,border-radius;
  }
  .opener{
    position:absolute;left:24px;top:648px;width:327px;height:48px;border-radius:10px;
    background:#3aae5b;overflow:hidden;
    will-change:left,top,width,height,border-radius;
  }
  .opener-white{position:absolute;inset:0;background:#fff;opacity:0;z-index:0;border-radius:inherit;}
  .opener-inner{position:absolute;left:-24px;top:-648px;width:375px;height:812px;z-index:1;will-change:left,top;}
  .frame.show-bib .opener{animation:cardOpen 1.15s forwards;}
  .frame.show-bib .opener-white{animation:whiten 1.15s ease forwards;}
  .frame.show-bib .opener-inner{animation:cardOpenInner 1.15s forwards;}
  /* button rect -> green circle (held) -> circle grows (staying round) until it
     covers the whole frame -> then white fades in, revealing the screen.
     Circle center = button center (187.5,672); at 1500px it covers every corner. */
  @keyframes cardOpen{
    0%  {left:24px;    top:648px; width:327px; height:48px;  border-radius:10px;  animation-timing-function:cubic-bezier(.5,0,.3,1);}
    16% {left:163.5px; top:648px; width:48px;  height:48px;  border-radius:24px;  animation-timing-function:linear;}
    26% {left:163.5px; top:648px; width:48px;  height:48px;  border-radius:24px;  animation-timing-function:cubic-bezier(.45,0,.2,1);}
    66% {left:-562.5px;top:-78px; width:1500px;height:1500px;border-radius:750px;}
    100%{left:-562.5px;top:-78px; width:1500px;height:1500px;border-radius:750px;}
  }
  @keyframes whiten{
    0%,66%{opacity:0;}
    86%,100%{opacity:1;}
  }
  @keyframes cardOpenInner{
    0%  {left:-24px;    top:-648px; animation-timing-function:cubic-bezier(.5,0,.3,1);}
    16% {left:-163.5px; top:-648px; animation-timing-function:linear;}
    26% {left:-163.5px; top:-648px; animation-timing-function:cubic-bezier(.45,0,.2,1);}
    66% {left:562.5px;  top:78px;}
    100%{left:562.5px;  top:78px;}
  }
  /* echo circle — concentric with the main one, a bit bigger and slightly ahead */
  .frame.show-bib .opener-echo{animation:cardOpenEcho 1.15s forwards;}
  @keyframes cardOpenEcho{
    0%  {left:24px;    top:648px; width:327px; height:48px;  border-radius:10px; animation-timing-function:cubic-bezier(.5,0,.3,1);}
    16% {left:159.5px; top:644px; width:56px;  height:56px;  border-radius:28px; animation-timing-function:linear;}
    26% {left:159.5px; top:644px; width:56px;  height:56px;  border-radius:28px; animation-timing-function:cubic-bezier(.45,0,.2,1);}
    66% {left:-662.5px;top:-178px;width:1700px;height:1700px;border-radius:850px;}
    100%{left:-662.5px;top:-178px;width:1700px;height:1700px;border-radius:850px;}
  }
  /* opening: label + arrow fade out (no scale, so nothing shifts) before the morph */
  .btn span,.btn .btn-arrow{transition:opacity .16s ease;}
  .btn.opening span,.btn.opening .btn-arrow{opacity:0;}
  .btn.opening{background:#3aae5b;}
  /* hide the real button once opening (its entrance animation is forwards, so
     it overrides a normal opacity:0 — needs !important to beat the animation) */
  .frame.show-bib .screen-home .btn{opacity:0 !important;animation:none !important;}

  /* ===================== Bibliotecas layout (positions 1:1) ===================== */
  .bib-h{position:absolute;left:16px;margin:0;font-weight:600;font-size:16px;line-height:26px;color:#1c1c1e;}
  .bib-h-estudos{top:166px;}
  .bib-h-protocolos{top:514px;}
  .bib-tabbar{position:absolute;left:0;top:729px;width:375px;height:90px;z-index:5;display:block;}

  /* search — tap feedback */
  .bib-search{position:absolute;left:16px;top:50px;width:343px;height:40px;padding:0;border:0;background:none;cursor:text;
    transition:filter .18s ease;}
  .bib-search img{display:block;width:343px;height:40px;}
  .bib-search:active{filter:brightness(.96);}

  /* filter tabs — interactive, sliding underline */
  .bib-tabs{position:absolute;left:0;top:106px;width:375px;height:36px;
    display:flex;gap:12px;align-items:flex-start;padding:0 16px;
    overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .bib-tabs::-webkit-scrollbar{display:none;}
  .tab{flex:none;border:0;background:none;font-family:inherit;cursor:pointer;white-space:nowrap;
    padding:0 4px 12px;font-size:16px;line-height:24px;font-weight:500;color:#6b6e6d;
    transition:color .2s ease,opacity .15s ease;}
  .tab.is-active{font-weight:600;color:#3aae5b;}
  .tab:active{opacity:.6;}
  .tab-underline{position:absolute;bottom:0;left:16px;width:0;height:2px;background:#3aae5b;border-radius:2px;
    transition:transform .32s cubic-bezier(.16,1,.3,1),width .32s cubic-bezier(.16,1,.3,1);}

  /* card rows — swipeable; cards — press */
  .bib-row{position:absolute;left:0;width:375px;display:flex;gap:19px;padding:0 16px;
    overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;
    scroll-snap-type:x proximity;}
  .bib-row::-webkit-scrollbar{display:none;}
  .bib-row-estudos{top:208px;}
  .bib-row-protocolos{top:556px;}
  .card-slot{flex:none;scroll-snap-align:start;}
  .bib-card{display:block;padding:0;border:0;background:none;cursor:pointer;
    transition:transform .18s cubic-bezier(.2,.8,.25,1);}
  .bib-card:active{transform:scale(.965);}
  .bib-card img{display:block;width:252px;height:282px;border-radius:8px;}

  /* assembly — pieces start hidden, animate in on show-bib */
  .screen-bib .bib-search,.screen-bib .bib-tabs,.screen-bib .bib-h,.screen-bib .card-slot,.screen-bib .bib-tabbar{opacity:0;will-change:transform,opacity;}
  .frame.show-bib .screen-bib .bib-h,
  .frame.show-bib .screen-bib .card-slot,
  .frame.show-bib .bib-tabs{animation:bibRise 1s cubic-bezier(.22,.61,.36,1) forwards;}
  @keyframes bibRise{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  .frame.show-bib .bib-search{animation:bibDrop .95s cubic-bezier(.22,.61,.36,1) forwards;}
  @keyframes bibDrop{from{opacity:0;transform:translateY(-12px);}to{opacity:1;transform:translateY(0);}}
  .frame.show-bib .bib-tabbar{animation:bibUp .95s cubic-bezier(.22,.61,.36,1) forwards;}
  @keyframes bibUp{from{opacity:0;transform:translateY(100%);}to{opacity:1;transform:translateY(0);}}

  /* stagger rhythm — content assembles once the surface is white & mostly open */
  .frame.show-bib .bib-search{animation-delay:.96s;}
  .frame.show-bib .bib-tabbar{animation-delay:1.00s;}
  .frame.show-bib .bib-tabs{animation-delay:1.06s;}
  /* Estudos section rises as one filled block (header + both cards together) */
  .frame.show-bib .bib-h-estudos{animation-delay:1.16s;}
  .frame.show-bib .bib-row-estudos .card-slot:nth-child(1){animation-delay:1.18s;}
  .frame.show-bib .bib-row-estudos .card-slot:nth-child(2){animation-delay:1.22s;}
  /* Protocolos section, also filled */
  .frame.show-bib .bib-h-protocolos{animation-delay:1.38s;}
  .frame.show-bib .bib-row-protocolos .card-slot:nth-child(1){animation-delay:1.40s;}
  .frame.show-bib .bib-row-protocolos .card-slot:nth-child(2){animation-delay:1.44s;}
</style>
</head>
<body>
  <div class="stage">
  <div class="frame" id="frame">
    <div class="screen screen-home" id="screenHome">
    <img class="hero reveal" id="hero" src="hero.jpg" alt="">
    <div class="hero-fade"></div>

    <h1 class="title">
      <span class="line"><span>Chegaram as</span></span>
      <span class="line"><span>bibliotecas</span></span>
    </h1>
    <p class="subtitle reveal">Embasamento científico sem sair da consulta</p>
    <p class="body reveal">Estudos, protocolos, guias de raças e casos reais, atualizados frequentemente.</p>

    <button class="btn reveal" id="cta">
      <span>Explorar bibliotecas</span>
      <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path class="shaft" d="M3.5 12H20.33" stroke="#fff" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/>
        <path class="head" d="M14.4302 5.92969L20.5002 11.9997L14.4302 18.0697" stroke="#fff" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button class="ghost reveal">Agora não</button>
    </div><!-- /screen-home -->

    <div class="screen screen-bib" id="screenBib">
      <div class="opener-echo" id="openerEcho"></div>
      <div class="opener" id="opener">
      <div class="opener-white"></div>
      <div class="opener-inner" id="openerInner">
        <button class="bib-search"><img src="bib/search.png" alt=""></button>

        <div class="bib-tabs" id="bibTabs">
          <button class="tab is-active">Todos</button>
          <button class="tab">Estudos</button>
          <button class="tab">Protocolos</button>
          <button class="tab">Raças</button>
          <button class="tab">Casos</button>
          <span class="tab-underline" id="tabUnderline"></span>
        </div>

        <h2 class="bib-h bib-h-estudos">Estudos</h2>
        <div class="bib-row bib-row-estudos">
          <div class="card-slot"><button class="bib-card"><img src="bib/card_estudos_1.png" alt=""></button></div>
          <div class="card-slot"><button class="bib-card"><img src="bib/card_estudos_2.png" alt=""></button></div>
        </div>

        <h2 class="bib-h bib-h-protocolos">Protocolos</h2>
        <div class="bib-row bib-row-protocolos">
          <div class="card-slot"><button class="bib-card"><img src="bib/card_protocolos_1.png" alt=""></button></div>
          <div class="card-slot"><button class="bib-card"><img src="bib/card_protocolos_2.png" alt=""></button></div>
        </div>

        <img class="bib-tabbar" src="bib/tabbar.png" alt="">
      </div>
      </div>
    </div>
  </div>
  </div>

<script>
  const frame = document.getElementById('frame');
  const stage = document.querySelector('.stage');
  const cta = document.getElementById('cta');
  const hero = document.getElementById('hero');

  // Scale the 375x812 frame to the viewport with a real numeric scale.
  // (CSS scale(calc(100vw/375)) is invalid — scale() needs a number, not a length.)
  function fit(){
    const mobile = window.matchMedia('(max-width:600px)').matches;
    if(mobile){
      const s = (window.innerWidth + 1) / 375; // +1px so the right edge is always flush (overflow clipped)
      frame.style.transformOrigin = 'top left';
      frame.style.transform = 'scale(' + s + ')';
      stage.style.width = '100%';
      stage.style.height = (812 * s) + 'px';
    } else {
      const s = Math.min(window.innerWidth / 375, window.innerHeight / 812);
      frame.style.transformOrigin = 'center center';
      frame.style.transform = 'scale(' + s + ')';
      stage.style.width = '';
      stage.style.height = '';
    }
  }
  fit();
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);

  function playVideo(){ if(hero && typeof hero.play === 'function'){ const p = hero.play(); if(p && p.catch) p.catch(()=>{}); } }

  function play(){
    frame.classList.remove('play');
    void frame.offsetWidth; // reflow to restart animations
    frame.classList.add('play');
    playVideo();
  }
  window.addEventListener('load', () => { playVideo(); setTimeout(play, 150); });
  window.addEventListener('keydown', e => { if(e.key.toLowerCase()==='r'){ frame.classList.remove('show-bib'); cta.classList.remove('opening'); play(); } });

  // CTA opens into Bibliotecas: fade the label/arrow, then the button morphs into
  // a green circle that grows and turns white, revealing the next screen.
  cta.addEventListener('click', () => {
    cta.classList.add('opening');
    setTimeout(() => { frame.classList.add('show-bib'); if(window.__placeUnderline) window.__placeUnderline(); }, 170);
  });

  // filter tabs: sliding green underline
  (function(){
    const wrap = document.getElementById('bibTabs');
    if(!wrap) return;
    const underline = document.getElementById('tabUnderline');
    const tabs = [...wrap.querySelectorAll('.tab')];
    const active = () => tabs.find(t => t.classList.contains('is-active')) || tabs[0];
    function place(tab){ if(!tab) return; underline.style.width = tab.offsetWidth + 'px'; underline.style.transform = 'translateX(' + (tab.offsetLeft - 16) + 'px)'; }
    tabs.forEach(t => t.addEventListener('click', () => {
      tabs.forEach(x => x.classList.remove('is-active'));
      t.classList.add('is-active');
      place(t); // offsetWidth read forces reflow so the SemiBold width is current
      t.scrollIntoView({inline:'center', block:'nearest', behavior:'smooth'});
    }));
    const init = () => place(active());
    window.__placeUnderline = init;
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(init);
    window.addEventListener('load', init);
  })();
  // fallback: if the browser blocks muted autoplay, start on first interaction
  document.addEventListener('click', playVideo);

</script>
</body>
</html>
