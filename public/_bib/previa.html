<!doctype html>
<meta charset="utf-8">
<title>bibliotecas — fileira rolando</title>
<style>
  body { margin:0; background:#111; font:13px ui-sans-serif,system-ui; color:#eee }
  body.render { background:#fff }
  body.render #barra { display:none }
  #palco { position:relative; margin:0 auto; transform-origin:top left; overflow:hidden; background:#F5F5F5 }
  #palco img.aparelho { position:absolute; display:block; max-width:none }
  /* a janela é a faixa vazia da fileira dentro da tela do celular do meio */
  #janela { position:absolute; overflow:hidden }
  #fileira { position:absolute; left:0; top:0; display:block; max-width:none }
  #barra { position:fixed; left:0; right:0; bottom:0; background:#1a1a1a; padding:10px 16px;
           display:flex; gap:18px; align-items:center; flex-wrap:wrap; z-index:9 }
  label { display:flex; gap:7px; align-items:center; opacity:.85; white-space:nowrap }
  input[type=range] { width:160px }
  code { opacity:.55 }
</style>

<main><div id="palco">
  <img class="aparelho" id="a1" src="/_bib/tela1.png" alt="">
  <img class="aparelho" id="a2" src="/_bib/tela2-limpa.png" alt="">
  <img class="aparelho" id="a3" src="/_bib/tela3.png" alt="">
  <div id="janela"><img id="fileira" src="/_bib/fileira.png" alt=""></div>
</div></main>

<div id="barra">
  <label>curso <input id="curso" type="range" min="200" max="500" value="375"><code id="ccurso"></code></label>
  <code id="info"></code>
</div>

<script type="module">
const params = new URLSearchParams(location.search);
const RENDER = params.has("render");
// ?mobile=1 monta a mesma peça com um aparelho só, no enquadramento dos mockups
// parados do celular (margem 194/120 em volta da moldura preta)
const MOBILE = params.has("mobile");
const W = MOBILE ? 1092 : 2720, H = MOBILE ? 1702 : 1791;

// Os telaN.png não estão no git: re-exporte do Figma (arquivo Projetos, página Vet
// Smart) pelo GRUPO do aparelho, não pelo frame — frames "bibliotecas 1/2/3", grupos
// 21054:1349 / 21054:1432 / 21054:1514, escala 1,07362. O tela2-limpa.png é o tela2
// com a faixa da fileira apagada em branco (x 42..689, y 924..1109).
// Os PNGs saem do Figma já na escala da composição (1:1, sem reescala no CSS): o grupo
// do aparelho exportado a 1,07362x dá 925x1631, com a moldura preta em (13, 8).
// Posicionar pela moldura, e não pela borda do PNG, é o que mantém o enquadramento da
// página igual ao da versão anterior — a sombra sobra do PNG e desalinharia a conta.
const PNG = { w: 925, h: 1631, pretoX: 13, pretoY: 8 };
const PRETO = MOBILE ? { x: [194], y: 120 }
                     : { x: [168, 1006.5, 1845], y: 161 };  // onde a moldura fica no palco
// a tela dentro do PNG, medida no próprio arquivo
const TELA = { x: 40.34, y: 36.28, w: 650.63, h: 1405.97 };
// a fileira dentro da tela do celular do meio, medida em tela2.png
const CARTAO1 = { x: 68, y: 929 };   // canto do 1º ladrilho
const FAIXA = { y: 924, h: 185 };    // faixa vazia que a fileira ocupa
const INT = { x0: 42, x1: 689 };     // interior da tela, sem encostar no bezel

const palco = document.getElementById("palco");
palco.style.width = W + "px"; palco.style.height = H + "px";

const esq = (i) => PRETO.x[i] - PNG.pretoX;
const topo = PRETO.y - PNG.pretoY;
const ORDEM = MOBILE ? ["a2"] : ["a1", "a2", "a3"];
if (MOBILE) for (const id of ["a1", "a3"]) document.getElementById(id).remove();
ORDEM.forEach((id, i) => {
  const el = document.getElementById(id);
  el.style.left = esq(i) + "px";
  el.style.top = topo + "px";
  el.style.width = PNG.w + "px";
  el.style.height = PNG.h + "px";
});

// tudo do celular do meio em coordenadas do palco
const base = { x: esq(ORDEM.indexOf("a2")), y: topo };
const janela = document.getElementById("janela");
janela.style.left = (base.x + INT.x0) + "px";
janela.style.width = (INT.x1 - INT.x0) + "px";
janela.style.top = (base.y + FAIXA.y) + "px";
janela.style.height = FAIXA.h + "px";

const fileira = document.getElementById("fileira");
fileira.style.left = (base.x + CARTAO1.x - (base.x + INT.x0)) + "px";
fileira.style.top = (CARTAO1.y - FAIXA.y) + "px";

function encaixa() {
  const s = Math.min((innerWidth - 40) / W, (innerHeight - 110) / H);
  palco.style.transform = `scale(${s})`;
  palco.style.marginLeft = ((innerWidth - W * s) / 2) + "px";
}
if (RENDER) { document.body.classList.add("render"); palco.style.transform = "none"; palco.style.marginLeft = "0"; }
else { addEventListener("resize", encaixa); encaixa(); }

let anim = null, CURSO = 375;
function monta() {
  if (anim) anim.cancel();
  // Segura, rola pra esquerda, segura, volta. A suavização vai trecho a trecho, não na
  // animação inteira: com um cubic-bezier único cobrindo os 6s as pausas encolhem e a
  // rolagem acelera fora de hora. As pausas são lineares porque pausa não tem o que suavizar.
  // Curva de arrastada, não de máquina: quase toda a distância sai no primeiro terço e o
  // resto desliza até parar — dedo nenhum acelera pra entrar no movimento.
  const FLICK = "cubic-bezier(.3,.68,.4,1)";
  anim = fileira.animate([
    { transform: "translateX(0)", offset: 0, easing: "linear" },
    { transform: "translateX(0)", offset: .18, easing: FLICK },
    { transform: `translateX(${-CURSO}px)`, offset: .48, easing: "linear" },
    { transform: `translateX(${-CURSO}px)`, offset: .68, easing: FLICK },
    { transform: "translateX(0)", offset: .96, easing: "linear" },
    { transform: "translateX(0)", offset: 1 },
  ], { duration: 6000, iterations: Infinity, easing: "linear" });
  if (RENDER) anim.pause();
  document.getElementById("info").textContent =
    `fileira 978px · janela ${INT.x1 - INT.x0}px · sobra ${978 - (INT.x1 - CARTAO1.x)}px`;
}

const ctrl = document.getElementById("curso");
if (params.has("curso")) ctrl.value = params.get("curso");
const aplica = () => { CURSO = +ctrl.value; document.getElementById("ccurso").textContent = CURSO + "px"; monta(); };
ctrl.oninput = aplica; aplica();

if (RENDER) {
  window.__pronto = false;
  let ultimo = null;
  const imgs = [...document.images];
  const todasProntas = () => imgs.every(i => i.complete && i.naturalWidth > 0);
  const tique = () => {
    const t = (window.__t ?? 0) * 1000;
    if (t !== ultimo) { ultimo = t; if (anim) anim.currentTime = t % 6000; window.__pronto = todasProntas(); }
    requestAnimationFrame(tique);
  };
  tique();
}
</script>
