<!doctype html>
<meta charset="utf-8">
<title>typeface e cor</title>
<style>
  body { margin:0; background:#111; font:13px ui-sans-serif,system-ui; color:#eee }
  body.render { background:#fff }
  body.render #barra { display:none }
  #palco { position:relative; margin:0 auto; transform-origin:top left; overflow:hidden; background:#fff }
  #palco img { position:absolute; display:block }
  #tipo { left:0; top:0 }
  .painel { position:absolute; top:0; overflow:hidden }
  .painel .fundo { position:absolute; inset:0 }
  #barra { position:fixed; left:0; right:0; bottom:0; background:#1a1a1a; padding:10px 16px;
           display:flex; gap:18px; align-items:center; flex-wrap:wrap; z-index:9 }
  label { display:flex; gap:7px; align-items:center; opacity:.85; white-space:nowrap }
  input[type=range] { width:340px }
  code { opacity:.55 }
  button { background:#2b2b2b; color:#eee; border:1px solid #444; border-radius:6px; padding:4px 12px; cursor:pointer }
</style>

<main><div id="palco">
  <img id="tipo" src="/design-slide-motion/typography.png" alt="">
</div></main>

<div id="barra">
  <button id="play">pausar</button>
  <label>t <input id="tempo" type="range" min="0" max="15.5" step="0.01" value="0"><code id="ct"></code></label>
  <code id="info"></code>
</div>

<script type="module">
const params = new URLSearchParams(location.search);
const RENDER = params.has("render");

// medido no próprio 07.gif: 3840x1898, metade esquerda é o typography.png em tamanho nativo
// e a direita é o painel de cor. O bloco de texto entra em escala 1:1, sem redimensionar.
const W = 3840, H = 1898;
const PAINEL = { x: 1920, w: 1920 };
const TEXTO = { x: 122, y: 576 };   // dentro do painel

const CORES = [
  { hex: "#3AAE5B", png: "chateau-green.png",  w: 670, h: 530 },
  { hex: "#1C1C1E", png: "aesthetic-black.png", w: 758, h: 530 },
  { hex: "#6B6E6D", png: "antique-silver.png",  w: 626, h: 530 },
  { hex: "#F3F4F6", png: "titanium-white.png",  w: 710, h: 530 },
  { hex: "#59D07B", png: "esmerald.png",        w: 762, h: 334 },
];

// mesma mecânica da rota /design-slide-motion: a cor sobe de baixo, o canto direito primeiro
// e mais rápido, o esquerdo vem atrás e equaliza, fechando no topo
const PARADA = 2.2, SUBIDA = 0.9;
const CICLO = PARADA + SUBIDA;
const DUR = CORES.length * CICLO;

const BLEED = 2, X0 = -BLEED, X1 = 100 + BLEED;
const clipY = v => (1 - v) * (100 + BLEED * 2) - BLEED;
const trava = n => Math.min(1, Math.max(0, n));
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

const el = id => document.getElementById(id);
const palco = el("palco");
palco.style.width = W + "px"; palco.style.height = H + "px";
el("tipo").style.width = PAINEL.x + "px"; el("tipo").style.height = H + "px";

// um painel por cor, empilhados: cada um é revelado pelo recorte que sobe
const paineis = CORES.map((c, i) => {
  const d = document.createElement("div");
  d.className = "painel";
  d.style.left = PAINEL.x + "px"; d.style.width = PAINEL.w + "px"; d.style.height = H + "px";
  d.innerHTML = `<div class="fundo" style="background:${c.hex}"></div>`;
  const t = document.createElement("img");
  t.src = "/design-slide-motion/" + c.png;
  t.style.left = TEXTO.x + "px"; t.style.top = TEXTO.y + "px";
  t.style.width = c.w + "px"; t.style.height = c.h + "px";
  d.appendChild(t);
  d.texto = t;
  palco.appendChild(d);
  return d;
});

function encaixa() {
  const s = Math.min((innerWidth - 40) / W, (innerHeight - 110) / H);
  palco.style.transform = `scale(${s})`;
  palco.style.marginLeft = ((innerWidth - W * s) / 2) + "px";
}
if (RENDER) {
  document.body.classList.add("render");
  palco.style.marginLeft = "0";
  const ajusta = () => { palco.style.transform = `scale(${innerWidth / W}, ${innerHeight / H})`; };
  addEventListener("resize", ajusta); ajusta();
} else { addEventListener("resize", encaixa); encaixa(); }

function desenha(t) {
  t = ((t % DUR) + DUR) % DUR;
  const n = Math.floor(t / CICLO);          // cor que está subindo ou parada
  const tc = t - n * CICLO;
  const p = tc < PARADA ? 1 : 1 - (tc - PARADA) / SUBIDA;
  // p vai de 1 (cor n inteira no ar) a 0 (a próxima já cobriu tudo)
  const sobe = 1 - p;
  const direita = easeOut(trava(sobe * 1.25));
  const esquerda = easeInOut(trava((sobe - 0.12) / 0.88));

  paineis.forEach((d, i) => {
    if (i === n) {
      d.style.clipPath = "none"; d.style.zIndex = 1; d.style.opacity = 1;
      // o texto antigo sai na frente da cor: cortado pela diagonal, ele se sobrepõe
      // ao texto novo e as duas palavras viram uma só por um instante
      d.texto.style.opacity = 1 - easeOut(trava(sobe / 0.45));
    }
    else if (i === (n + 1) % CORES.length && sobe > 0) {
      d.texto.style.opacity = 1;
      d.style.zIndex = 2; d.style.opacity = 1;
      d.style.clipPath =
        `polygon(${X0}% ${clipY(esquerda)}%, ${X1}% ${clipY(direita)}%, ${X1}% ${clipY(0)}%, ${X0}% ${clipY(0)}%)`;
    } else { d.style.opacity = 0; d.style.zIndex = 0; }
  });
}

el("info").textContent = `${W}x${H} · ${CORES.length} cores · parada ${PARADA}s + subida ${SUBIDA}s · ${DUR.toFixed(1)}s`;

window.__pronto = false;
Promise.all([...document.images].map(f => f.decode().catch(() => {}))).then(() => {
  desenha(0); window.__pronto = true;
});

const tempo = el("tempo"), ct = el("ct");
if (RENDER) {
  const tique = () => { desenha(window.__t ?? 0); window.__pronto = true; requestAnimationFrame(tique); };
  tique();
} else {
  let rodando = true, t0 = performance.now() / 1000;
  const botao = el("play");
  botao.onclick = () => { rodando = !rodando; botao.textContent = rodando ? "pausar" : "tocar";
    if (rodando) t0 = performance.now() / 1000 - (+tempo.value); };
  tempo.oninput = () => { rodando = false; botao.textContent = "tocar"; };
  const tique = () => {
    const t = rodando ? (performance.now() / 1000 - t0) % DUR : +tempo.value;
    if (rodando) tempo.value = t.toFixed(2);
    ct.textContent = t.toFixed(2) + "s";
    desenha(t); requestAnimationFrame(tique);
  };
  tique();
}
</script>
