,14.52,4.77,20.64,9.41,19.27,14.63,21.34,42.88,5.14,60.8Z", "M1360.81,109.97c-14.36,7.34-10.3,35.16-8.56,51.11l1.62,14.81c.58,5.35.77,12.14-1.68,16.99-2.91,5.77-10,7.81-15.87,7.51l-24.99-1.29c-7.59-.39-12.78-5.5-12.7-13.4l.24-24.24-3.75-92.87c-.17-4.12-.1-10.33,3.72-12.29,13.19-6.75,38.26-7.95,43.66,2.96,2.35,4.75,2.84,10.88,3.95,16.27,6.4-8.11,12.89-16.59,22.93-20.75,7.05-2.93,17.59-4.37,23.14,1.5,5.6,8.4,1.99,33.96-2.35,44.07-3.68,8.56-18.14,3.89-29.36,9.63Z"];
const SYMBOL = ["M264.96,193.48c13.86,5.66-3.13,31.94-23.44,39.02-17.82,6.22-36.66.65-51.15-11.2-15.39,8.31-32.05,15.28-50.35,16.21-10.3.52-20.63.89-30.9-.04-24.5-2.23-46.88-12.51-65.63-27.91C11.94,183.62-4.17,144.2.93,103.28,7.72,48.76,52.76,5.12,108.02.92c8.98-.68,18.24-.9,26.65-.14,72.58,6.56,122.17,73.84,108.64,144.74-4.52,23.69-15.99,44.88-34.52,61.65,7.66,6.86,18.09,9.84,27.79,6.06,16.5-6.43,16.17-24.74,28.38-19.76ZM225.06,119.34c0-55.97-45.53-101.34-101.7-101.34S21.67,63.37,21.67,119.34s45.53,101.34,101.7,101.34,101.7-45.37,101.7-101.34Z", "M135.99,171.41c-.02,7.39-6.26,11.81-12.4,11.35-6.64-.49-11.03-5.63-11.02-12.67l.06-41.07-41.55-.05c-7.2,0-12.2-5.42-12.14-12.09.06-6.29,5.12-11.67,12.31-11.69l41.47-.1-.06-40.59c0-6.59,5.03-11.15,10.98-11.62,5.35-.42,12.25,3.68,12.28,10.08l.18,42.11,42.62.19c6.68.03,11.58,5.94,11.7,11.58s-4.69,12.04-11.37,12.05l-42.95.13-.11,42.39Z"];

const W = 1920, H = 1080, FPS = 60, DUR_S = 3.6;
const TOTAL_FRAMES = Math.round(DUR_S * FPS);

const GREEN = "#3CAA5E";     // verde do ícone
const INK = "#111111";
const BRAND = "#48B46C";     // verde do fundo final
const WHITE = "#FFFFFF";

const LOGO_W = 783;
const S = LOGO_W / 1503.13;
const LOGO_H = 238.03 * S;
const LEFT = 961 - LOGO_W / 2;
const TOP = 553 - LOGO_H / 2;
const SYMBOL_CX = 135 * S;
const SYMBOL_CY = 119 * S;
const START_DX = 960 - LEFT - SYMBOL_CX;
const START_DY = 540 - TOP - SYMBOL_CY;
const ZOOM = 1.2;
const RANK = [7, 4, 5, 0, 1, 2, 3, 6];   // v e t s m a r t, da esquerda pra direita
const T = { grow: 0.0, move: 0.3, rise: 0.5, stagger: 0.045, zoom: 1.0 };

// final
const LETTERS_X0 = 333.8 * S;
const LETTERS_W = (1503.13 - 333.8) * S;
const LETTERS_H = 203.1 * S;
const END_SCALE = 1.18;
const END_W = LOGO_W * END_SCALE;
const END_S = END_W / 1503.13;
const END_LEFT = W / 2 - (LETTERS_X0 + LETTERS_W / 2) * END_SCALE;
const END_TOP = H / 2 - (LETTERS_H / 2) * END_SCALE;

const RISE_AT = 2.1, RISE_DUR = 0.9;
const BLEED = 2;
const clamp = n => n < 0 ? 0 : n > 1 ? 1 : n;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
const clipY = v => (1 - v) * (100 + BLEED * 2) - BLEED;

function bezier(x1, y1, x2, y2) {
  const ax = 3*x1 - 3*x2 + 1, bx = 3*x2 - 6*x1, cx = 3*x1;
  const ay = 3*y1 - 3*y2 + 1, by = 3*y2 - 6*y1, cy = 3*y1;
  const fx = t => ((ax*t + bx)*t + cx)*t, dfx = t => (3*ax*t + 2*bx)*t + cx;
  return x => { let t = clamp(x);
    for (let i = 0; i < 6; i++) { const d = dfx(t); if (Math.abs(d) < 1e-6) break; t -= (fx(t) - x) / d; }
    t = clamp(t); return ((ay*t + by)*t + cy)*t; };
}
const E_GROW = bezier(0.1, 1, 0.3, 1);
const E_MOVE = bezier(0.25, 0.1, 0.1, 1);
const E_RISE = bezier(0.44, 0, 0.34, 0.98);   // a mesma do Fuel
const E_ZOOM = bezier(0.4, 0, 0.1, 1);

const P_LETTERS = LETTERS.map(d => new Path2D(d));
const P_SYMBOL = SYMBOL.map(d => new Path2D(d));

function drawFrame(ctx, t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.fillStyle = WHITE;
  ctx.fillRect(0, 0, W, H);

  // cena: zoom out de 20% até encaixar
  const zs = ZOOM + (1 - ZOOM) * E_ZOOM(clamp((t - T.zoom) / 0.8));
  ctx.save();
  ctx.translate(LEFT + LOGO_W / 2, TOP + LOGO_H / 2);
  ctx.scale(zs, zs);
  ctx.translate(-LOGO_W / 2, -LOGO_H / 2);

  // símbolo: cresce no centro e desliza pro lugar
  const mp = E_MOVE(clamp((t - T.move) / 0.65));
  const gLin = clamp((t - T.grow) / 0.5);
  const gp = E_GROW(gLin);
  ctx.save();
  ctx.translate(START_DX * (1 - mp), START_DY * (1 - mp));
  ctx.translate(SYMBOL_CX, SYMBOL_CY);
  const sc = 0.2 + 0.8 * gp;
  ctx.scale(sc, sc);
  ctx.translate(-SYMBOL_CX, -SYMBOL_CY);
  ctx.globalAlpha = clamp(gLin / 0.4);
  ctx.scale(S, S);
  ctx.fillStyle = GREEN;
  for (const p of P_SYMBOL) ctx.fill(p);
  ctx.restore();
  ctx.globalAlpha = 1;

  // nome: sai da máscara (a caixa do logo corta o que passa por baixo)
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, LOGO_W, LOGO_H);
  ctx.clip();
  ctx.scale(S, S);
  ctx.fillStyle = INK;
  for (let i = 0; i < P_LETTERS.length; i++) {
    const rp = E_RISE(clamp((t - (T.rise + RANK[i] * T.stagger)) / 0.65));
    ctx.save();
    ctx.translate(0, 300 * (1 - rp));   // 300 em unidades do viewBox, como no SVG
    ctx.fill(P_LETTERS[i]);
    ctx.restore();
  }
  ctx.restore();
  ctx.restore();

  // subida do verde: direita na frente, esquerda atrás, equalizando no topo
  const p = clamp((t - RISE_AT) / RISE_DUR);
  if (p <= 0) return;
  const right = easeOut(clamp(p * 1.25));
  const left = easeInOut(clamp((p - 0.12) / 0.88));
  const poly = new Path2D();
  poly.moveTo(-BLEED / 100 * W, clipY(left) / 100 * H);
  poly.lineTo((100 + BLEED) / 100 * W, clipY(right) / 100 * H);
  poly.lineTo((100 + BLEED) / 100 * W, clipY(0) / 100 * H);
  poly.lineTo(-BLEED / 100 * W, clipY(0) / 100 * H);
  poly.closePath();

  ctx.save();
  ctx.clip(poly);
  ctx.fillStyle = BRAND;
  ctx.fillRect(0, 0, W, H);
  // a palavra branca, parada no lugar final, com o MESMO recorte
  ctx.translate(END_LEFT, END_TOP);
  ctx.scale(END_S, END_S);
  ctx.fillStyle = WHITE;
  for (const pa of P_LETTERS) ctx.fill(pa);
  ctx.restore();
}

/* ---------- preview ---------- */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const hud = document.getElementById("hud");
const msg = document.getElementById("msg");

function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  canvas.style.width = W * s + "px"; canvas.style.height = H * s + "px";
  canvas.style.left = (innerWidth - W * s) / 2 + "px";
  canvas.style.top = (innerHeight - H * s) / 2 + "px";
}
fit(); addEventListener("resize", fit);

const q = new URLSearchParams(location.search);
let frame = q.has("f") ? +q.get("f") : q.has("t") ? Math.round(+q.get("t") * FPS) : 0;
let playing = !(q.has("f") || q.has("t"));
let anchorFrame = frame, anchorTime = performance.now();
let recording = false;

function paint() {
  const f = ((frame % TOTAL_FRAMES) + TOTAL_FRAMES) % TOTAL_FRAMES;
  drawFrame(ctx, f / FPS);
  hud.textContent = `${f}/${TOTAL_FRAMES}  ${(f/FPS).toFixed(2)}s  ${playing ? "" : "⏸"}  ·  ${DUR_S}s @ ${FPS}fps · ␣ pausa · ←/→ quadro`;
}
(function tick() {
  if (!recording) { if (playing) frame = anchorFrame + Math.round((performance.now() - anchorTime) / 1000 * FPS); paint(); }
  requestAnimationFrame(tick);
})();
addEventListener("keydown", e => {
  if (e.key === " ") { e.preventDefault(); playing = !playing; anchorFrame = frame; anchorTime = performance.now(); }
  if (e.key === "ArrowRight") { playing = false; frame += e.shiftKey ? 10 : 1; }
  if (e.key === "ArrowLeft") { playing = false; frame -= e.shiftKey ? 10 : 1; }
});

/* ---------- gravação ---------- */
document.getElementById("rec").onclick = async () => {
  if (recording) return;
  recording = true; playing = false;
  try {
    const stream = canvas.captureStream(0);
    const track = stream.getVideoTracks()[0];
    const mime = MediaRecorder.isTypeSupported("video/mp4;codecs=avc1.640034")
      ? "video/mp4;codecs=avc1.640034" : "video/webm;codecs=vp9";
    const ext = mime.startsWith("video/mp4") ? "mp4" : "webm";
    const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 24e6 });
    const chunks = []; rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    const done = new Promise(r => rec.onstop = r);
    rec.start();
    const t0 = performance.now();
    for (let f = 0; f < TOTAL_FRAMES; f++) {
      drawFrame(ctx, f / FPS);
      track.requestFrame();
      msg.textContent = `gravando ${Math.round((f+1)/TOTAL_FRAMES*100)}%`;
      const wait = t0 + (f+1)/FPS*1000 - performance.now();
      if (wait > 0) await new Promise(r => setTimeout(r, wait));
    }
    rec.stop(); await done;
    const blob = new Blob(chunks, { type: mime });
    msg.textContent = `enviando ${(blob.size/1e6).toFixed(1)} MB…`;
    let saved = false;
    try {
      const res = await fetch(`/api/save-render?name=logo-vetsmart-verde.${ext}`, { method: "POST", body: blob });
      if (res.ok) { const j = await res.json(); msg.textContent = `salvo em ${j.path} (${(j.bytes/1e6).toFixed(1)} MB)`; saved = true; }
    } catch {}
    if (!saved) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `logo-vetsmart-verde.${ext}`; a.click(); msg.textContent = "baixado"; }
  } catch (e) { msg.textContent = "erro: " + e.message; }
  finally { recording = false; anchorFrame = frame = 0; anchorTime = performance.now(); playing = true; }
};
</script>
